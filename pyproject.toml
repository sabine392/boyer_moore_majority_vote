[project]
name = "boyer-moore-majority-vote"
version = "0.1.1"
description = "A streaming counter that identifies the majority element appearing more than half the time using constant space and a single pass."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
